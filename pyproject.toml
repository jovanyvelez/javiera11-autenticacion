[project]
name = "html-test"
version = "0.1.0"
description = "Autenticación web (monolito): FastAPI + Jinja2 + JWT + asyncpg, contraseñas con argon2"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
]

[tool.fastapi]
entrypoint = "main:app"
